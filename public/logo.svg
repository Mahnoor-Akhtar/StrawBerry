<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Berry Bliss Logo</title>
  <desc id="desc">Pink brand panel with strawberry icon and Berry Bliss text.</desc>
  <defs>
    <linearGradient id="berryBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d75f84" />
      <stop offset="100%" stop-color="#c94972" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#b43f64" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="900" height="320" rx="24" fill="url(#berryBg)" />

  <g transform="translate(82 44)" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M74 45C58 29 44 11 44 -7" />
    <path d="M74 45C74 23 85 4 101 -11" />
    <path d="M74 45C90 29 104 11 104 -7" />
    <path d="M74 45C74 23 63 4 47 -11" />
    <path d="M74 45C24 45 0 83 0 132c0 62 42 112 94 112s94-50 94-112c0-49-24-87-114-87Z" />
    <ellipse cx="48" cy="110" rx="6" ry="8" fill="#fff" stroke="none" />
    <ellipse cx="83" cy="148" rx="6" ry="8" fill="#fff" stroke="none" />
    <ellipse cx="122" cy="108" rx="6" ry="8" fill="#fff" stroke="none" />
    <ellipse cx="58" cy="178" rx="6" ry="8" fill="#fff" stroke="none" />
    <ellipse cx="102" cy="196" rx="6" ry="8" fill="#fff" stroke="none" />
  </g>

  <g fill="#fff" font-family="Poppins, Montserrat, Arial, sans-serif" font-weight="800" filter="url(#softShadow)">
    <text x="360" y="145" font-size="100" letter-spacing="2">BERRY</text>
    <text x="360" y="247" font-size="100" letter-spacing="2">BLISS</text>
